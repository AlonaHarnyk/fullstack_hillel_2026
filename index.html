<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 3</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <main>
      <form>
        <input type="text" name="name" placeholder="Enter your name" />
        <label>Password: <input type="password" name="password" /></label>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" />
        <input type="number" name="age" />
        <input type="date" name="birthdate" />
        <input type="file" name="avatar" />
        <textarea rows="4" cols="50" placeholder="Comment"></textarea>
        <label>
          Discount:
          <select name="discount">
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="50">50%</option>
          </select>
        </label>
        <fieldset>
          <legend>Sex:</legend>
          <label> <input type="radio" name="sex" />Male</label>
          <label> <input type="radio" name="sex" />Female</label>
        </fieldset>
        <label><input type="checkbox" />Agree with rules</label>
        <fieldset>
          <legend>Choose hobbies:</legend>
          <label
            ><input name="hobby" type="checkbox" value="reading" />
            Reading</label
          >
          <label
            ><input name="hobby" type="checkbox" value="dancing" />
            Dancing</label
          >
          <label
            ><input name="hobby" type="checkbox" value="fishing" />
            Fishing</label
          >
        </fieldset>
        <button type="submit">Sumbit</button>
        <button type="reset">Reset</button>
      </form>
      <button type="button" class="open">Click</button>
    </main>
  </body>
</html>
